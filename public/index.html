<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conjure</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1b1a17; --muted: #6b675f; --line: #e4e1da;
    --accent: #5b3df5; --accent-ink: #ffffff; --ok: #1f8a4c; --bad: #c2352b; --code: #f1efe9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f0f12; --panel: #17171c; --ink: #ecebf2; --muted: #9a98a6; --line: #2a2a33;
      --accent: #8f7bff; --accent-ink: #0f0f12; --ok: #4cc27f; --bad: #ff6f61; --code: #1e1e25; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 18px 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .02em; }
  header .mode { font-size: 12px; color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(320px, 420px) 1fr; min-height: calc(100vh - 62px); }
  section { padding: 20px 24px; min-width: 0; }
  .left { border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
  textarea { width: 100%; min-height: 96px; resize: vertical; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; }
  textarea.small { min-height: 64px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .log { overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: 12.5px/1.55 ui-monospace, Consolas, monospace; white-space: pre-wrap; min-height: 160px; max-height: 40vh; }
  .log .phase { color: var(--accent); font-weight: 700; }
  .log .ok { color: var(--ok); } .log .bad { color: var(--bad); } .log .dim { color: var(--muted); }
  .right { display: flex; flex-direction: column; gap: 14px; }
  .preview { flex: 1; min-height: 380px; border: 1px solid var(--line); border-radius: 12px; background: #fff; width: 100%; }
  .bar { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .bar a { color: var(--accent); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 6px 0 0; }
  ul.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  ul.hist li { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  ul.hist li.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  ul.hist li span.i { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  ul.hist li > div { min-width: 0; }
  .pill { font-size: 11px; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; align-self: start; white-space: nowrap; }
  .refine { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: none; flex-direction: column; gap: 10px; }
  .refine.on { display: flex; }
  .refine ol { margin: 0; padding-left: 20px; font-size: 13px; color: var(--muted); }
  .meta { font-size: 12px; color: var(--muted); }
  a.btnlink { color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 9px 16px; text-decoration: none; font-weight: 600; }
  a.btnlink:hover { border-color: var(--accent); }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } .left { border-right: 0; border-bottom: 1px solid var(--line); } section { padding: 16px; } }
</style>
</head>
<body>
<header><h1>✦ Conjure</h1><span class="mode" id="mode">checking…</span></header>
<main>
  <section class="left">
    <textarea id="intent" placeholder="Describe what to conjure, e.g. “a pomodoro timer with a task list that remembers tasks”"></textarea>
    <div class="row">
      <button id="go">Conjure</button>
      <button id="stop" class="ghost" disabled>Stop</button>
      <label><input type="checkbox" id="mock"> offline (mock)</label>
      <label><input type="checkbox" id="flaw"> inject bug</label>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
    <h2>History</h2>
    <ul class="hist" id="hist"></ul>
  </section>
  <section class="right">
    <div class="bar"><span id="what">Nothing conjured yet.</span><span id="links"></span></div>
    <iframe class="preview" id="preview" title="Preview"></iframe>
    <div class="refine" id="refine">
      <strong id="refineTitle">Refine</strong>
      <ol id="changes"></ol>
      <textarea id="change" class="small" placeholder="Describe a change, e.g. “add a dark mode toggle”"></textarea>
      <div class="row"><button id="apply">Apply change</button><a id="download" class="btnlink" href="#" download>Download .zip</a><span class="meta" id="selMeta"></span></div>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log");
let previewOrigin = "";
let selected = null;   // { dir, ... } from history
let running = null;    // AbortController for the in-flight request
let textEl = null;

function line(text, cls) { textEl = null; const d = document.createElement("div"); if (cls) d.className = cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; }
function stream(text) { if (!textEl) { textEl = document.createElement("span"); textEl.className = "dim"; log.appendChild(textEl); } textEl.textContent += text; log.scrollTop = log.scrollHeight; }
const money = (c) => (c == null ? "" : `~$${c.toFixed(4)}`);

function show(dir, m) {
  const files = m.files || [];
  const entry = files.includes("index.html") ? "index.html" : files[0];
  const ok = m.verification?.ok ?? m.ok;
  $("what").textContent = `${m.plan?.name ?? m.name ?? dir} · ${ok ? "verified" : "checks failing"}`;
  $("links").innerHTML = "";
  for (const f of files) { const a = document.createElement("a"); a.href = `${previewOrigin}/${encodeURIComponent(dir)}/${f}`; a.target = "_blank"; a.rel = "noopener"; a.textContent = f; $("links").append(a, " "); }
  $("preview").src = entry ? `${previewOrigin}/${encodeURIComponent(dir)}/${entry}?t=${Date.now()}` : "about:blank";
}

function select(item) {
  selected = item;
  show(item.dir, item);
  document.querySelectorAll("#hist li").forEach((li) => li.classList.toggle("sel", li.dataset.dir === item.dir));
  $("refine").classList.add("on");
  $("refineTitle").textContent = `Refine “${item.name ?? item.dir}”`;
  $("download").href = `/api/download?dir=${encodeURIComponent(item.dir)}`;
  $("changes").innerHTML = "";
  for (const c of item.changes || []) { const li = document.createElement("li"); li.textContent = c; $("changes").append(li); }
  $("selMeta").textContent = [item.provider, money(item.costUsd), `${(item.changes || []).length} change(s)`].filter(Boolean).join(" · ");
}

async function refresh(selectDir) {
  const s = await (await fetch("/api/status")).json();
  previewOrigin = s.previewOrigin;
  $("mode").textContent = s.live ? "live · Claude" : "offline · mock provider (add ANTHROPIC_API_KEY to .env for live)";
  if (!s.live) $("mock").checked = true;
  const h = await (await fetch("/api/history")).json();
  $("hist").innerHTML = "";
  for (const item of h) {
    const li = document.createElement("li"); li.dataset.dir = item.dir;
    const left = document.createElement("div");
    const strong = document.createElement("strong"); strong.textContent = item.name ?? item.dir;
    const sub = document.createElement("span"); sub.className = "i"; sub.textContent = item.intent + (item.changes?.length ? ` · +${item.changes.length} change(s)` : "");
    left.append(strong, sub);
    const pill = document.createElement("span"); pill.className = "pill"; pill.style.color = item.ok ? "var(--ok)" : "var(--bad)"; pill.textContent = item.ok ? "ok" : "fail";
    li.append(left, pill); li.onclick = () => select(item); $("hist").append(li);
  }
  const want = selectDir ?? selected?.dir;
  const again = h.find((x) => x.dir === want);
  if (again) select(again);
}

function setBusy(b) { $("go").disabled = b; $("apply").disabled = b; $("stop").disabled = !b; }

async function run(url, body) {
  setBusy(true); log.textContent = ""; textEl = null;
  running = new AbortController();
  let doneDir = null;
  try {
    const res = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body), signal: running.signal });
    if (!res.ok) { line(await res.text(), "bad"); return; }
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!chunk.startsWith("data: ")) continue;
        const e = JSON.parse(chunk.slice(6));
        if (e.type === "start") line(`provider=${e.provider} model=${e.model}`, "dim");
        else if (e.type === "phase") line(`» ${e.phase}${e.attempt ? " #" + e.attempt : ""}`, "phase");
        else if (e.type === "plan") { line(`${e.plan.name}: ${e.plan.summary}`); e.plan.files.forEach(f => line(`  · ${f.path} — ${f.purpose}`, "dim")); }
        else if (e.type === "text" && e.phase === "forge") stream(e.text);
        else if (e.type === "file") line(`wrote ${e.path} (${e.bytes} B)`);
        else if (e.type === "verify") { const f = e.report.results.filter(r => !r.ok); if (f.length) { line(`✗ ${f.length} check(s) failed`, "bad"); f.forEach(r => line(`  ${r.file} [${r.check}] ${r.detail}`, "dim")); } else line(`✓ ${e.report.results.length} checks passed`, "ok"); }
        else if (e.type === "done") {
          const r = e.refinement ?? e.manifest; const ok = e.refinement ? e.refinement.ok : e.manifest.verification.ok;
          line(`✓ done: ${r.summary || e.manifest.plan.name}`, ok ? "ok" : "bad");
          const u = r.usage; line(`${(r.durationMs / 1000).toFixed(1)}s · ${u.input_tokens} in / ${u.output_tokens} out tokens ${money(r.costUsd)}`, "dim");
          doneDir = e.dir;
        }
        else if (e.type === "cancelled") line("cancelled", "bad");
        else if (e.type === "error") line(`error: ${e.message}`, "bad");
      }
    }
  } catch (err) {
    if (err.name === "AbortError") line("cancelled", "bad"); else line(String(err), "bad");
  } finally {
    running = null; setBusy(false); refresh(doneDir ?? undefined);
  }
}

$("go").onclick = () => {
  const intent = $("intent").value.trim();
  if (!intent) return $("intent").focus();
  run("/api/conjure", { intent, mock: $("mock").checked, flaw: $("flaw").checked });
};
$("apply").onclick = () => {
  const change = $("change").value.trim();
  if (!selected || !change) return $("change").focus();
  $("change").value = "";
  run("/api/refine", { dir: selected.dir, change, mock: $("mock").checked });
};
$("stop").onclick = async () => {
  await fetch("/api/cancel", { method: "POST" }).catch(() => {});
  running?.abort();
};
$("intent").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("go").click(); });
$("change").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("apply").click(); });
refresh();
</script>
</body>
</html>
